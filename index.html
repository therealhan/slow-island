<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e6">
  <meta name="description" content="在慢慢小島完成每日小任務，收集星星並佈置自己的療癒小島。">
  <title>慢慢小島｜回到小島</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-base-path="./" data-page="home">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="慢慢小島首頁">
      <span class="brand-mark" aria-hidden="true">✿</span><span>慢慢小島</span>
    </a>
    <nav class="site-nav" aria-label="主要導覽">
      <a class="active" href="index.html">小島首頁</a>
      <a href="pages/tasks.html">每日任務</a>
      <a href="pages/island.html">佈置小島</a>
      <a href="pages/collection.html">收藏圖鑑</a>
      <a href="pages/progress.html">成長紀錄</a>
    </nav>
    <div class="currency-bar" aria-label="目前持有的貨幣">
      <span class="currency-pill"><span class="currency-star" aria-hidden="true">★</span><b data-currency="stars">0</b></span>
      <span class="currency-pill"><span class="currency-shell" aria-hidden="true">◒</span><b data-currency="shells">0</b></span>
    </div>
  </header>
  <main class="page-shell home-page">
    <section class="welcome-row">
      <div>
        <p class="eyebrow"><span class="eyebrow-dot"></span> 一個屬於你的慢步調角落</p>
        <h1>早安，島主 <span class="title-sparkle">✦</span></h1>
        <p class="welcome-copy">今天也不用急，先來看看小島上的風景吧。</p>
      </div>
      <a class="button button-quiet" href="pages/tasks.html">看看今天的小任務 <span aria-hidden="true">→</span></a>
    </section>

    <section class="home-scene-section" aria-label="我的小島">
      <div class="scene-note note-one"><span class="note-pin">✦</span> 海風剛剛好</div>
      <div class="scene-note note-two"><span class="note-pin">♡</span> 慢慢生活中</div>
      <div class="island-scene" data-island-scene>
        <img class="scene-art" src="assets/images/island/island-scene.svg" alt="漂浮在海上的綠色小島，有小屋、樹木、花朵與柔軟的雲朵">
        <img class="scene-character" src="assets/images/characters/island-cat.svg" alt="坐在草地上的小島貓咪">
        <div class="placed-decorations" data-placed-decorations aria-label="已放置的島嶼裝飾"></div>
        <span class="scene-bird bird-one" aria-hidden="true">⌁</span>
        <span class="scene-bird bird-two" aria-hidden="true">⌁</span>
      </div>
      <div class="scene-caption"><span class="caption-flower" aria-hidden="true">✿</span> 今天的小島，也在好好呼吸。</div>
    </section>

    <section class="home-summary-grid">
      <article class="paper-card task-summary-card">
        <div class="card-heading">
          <div><p class="eyebrow">每日一點點</p><h2>今日任務</h2></div>
          <span class="round-stamp" aria-hidden="true">☀</span>
        </div>
        <div class="task-progress-line">
          <span data-home-task-count>0 / 5 完成</span>
          <span class="progress-track"><span data-home-progress></span></span>
        </div>
        <div class="mini-task-list" data-home-tasks></div>
        <a class="text-link" href="pages/tasks.html">前往任務小本本 <span aria-hidden="true">→</span></a>
      </article>
      <aside class="home-side-stack">
        <article class="paper-card wallet-card">
          <div class="card-heading compact-heading">
            <div><p class="eyebrow">慢慢累積的好心情</p><h2>小島口袋</h2></div>
            <span class="pouch-icon" aria-hidden="true">✧</span>
          </div>
          <div class="wallet-values">
            <div><span class="wallet-symbol star-symbol" aria-hidden="true">★</span><span>星星</span><strong data-currency="stars">0</strong></div>
            <div><span class="wallet-symbol shell-symbol" aria-hidden="true">◒</span><span>貝殼</span><strong data-currency="shells">0</strong></div>
          </div>
          <p class="tiny-note">完成小任務，讓星星一顆一顆亮起來。</p>
        </article>
        <a class="feature-link" href="pages/island.html">
          <span class="feature-icon" aria-hidden="true">✿</span>
          <span><strong>為小島添一點新風景</strong><small>挑一件喜歡的裝飾吧</small></span>
          <span class="feature-arrow" aria-hidden="true">↗</span>
        </a>
      </aside>
    </section>
    <section class="home-quick-links" aria-label="更多小島功能">
      <a href="pages/collection.html"><span aria-hidden="true">▧</span> 翻翻收藏圖鑑</a>
      <a href="pages/progress.html"><span aria-hidden="true">✧</span> 看看成長紀錄</a>
      <p>不趕時間，今天也很值得。</p>
    </section>
  </main>
  <footer class="site-footer"><span>慢慢小島</span><span>願每個小小的努力，都被溫柔收藏。</span></footer>
  <script src="data/tasks.js"></script>
  <script src="data/items.js"></script>
  <script src="data/achievements.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
