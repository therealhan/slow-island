<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e6">
  <title>每日任務｜慢慢小島</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-base-path="../" data-page="tasks">
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">✿</span><span>慢慢小島</span></a>
    <nav class="site-nav" aria-label="主要導覽">
      <a href="../index.html">小島首頁</a><a class="active" href="tasks.html">每日任務</a><a href="island.html">佈置小島</a><a href="collection.html">收藏圖鑑</a><a href="progress.html">成長紀錄</a>
    </nav>
    <div class="currency-bar"><span class="currency-pill"><span class="currency-star" aria-hidden="true">★</span><b data-currency="stars">0</b></span><span class="currency-pill"><span class="currency-shell" aria-hidden="true">◒</span><b data-currency="shells">0</b></span></div>
  </header>
  <main class="page-shell inner-page">
    <section class="page-intro">
      <p class="eyebrow"><span class="eyebrow-dot"></span> 小小一步，也是很棒的一步</p>
      <h1>今日任務 <span class="title-sparkle">✦</span></h1>
      <p>挑一件現在做得到的小事，完成後就能把星星帶回家。</p>
    </section>
    <section class="task-page-layout">
      <div class="paper-card task-board">
        <div class="board-topline"><div><p class="eyebrow" data-today-label></p><h2>今天想照顧的自己</h2></div><div class="task-total-stamp"><strong data-task-count>0 / 0</strong><span>完成</span></div></div>
        <div class="task-list" data-task-list></div>
        <div class="task-board-footer"><span>完成任務後，星星會自動放進口袋。</span><span>每天都會重新開始 ✿</span></div>
      </div>
      <aside class="paper-card gentle-card">
        <span class="gentle-doodle" aria-hidden="true">☁</span>
        <p class="eyebrow">給今天的你</p><h2>不用一次做到全部</h2>
        <p>喝一口水、伸個懶腰，都是照顧自己的方式。依照自己的步調，完成一件也很值得。</p>
        <div class="reward-note"><span aria-hidden="true">★</span><span>每件小事都有星星獎勵</span></div>
      </aside>
    </section>
  </main>
  <footer class="site-footer"><span>慢慢小島</span><span>今天的你，已經很努力了。</span></footer>
  <script src="../data/tasks.js"></script><script src="../data/items.js"></script><script src="../data/achievements.js"></script><script src="../assets/js/storage.js"></script><script src="../assets/js/main.js"></script><script src="../assets/js/tasks.js"></script>
</body>
</html>
